# ─────────────────────────────────────────────────────────────
# Neovide CLI 配置（TOML）
#
# Neovide 只从固定路径读取本文件，仓库在这里维护唯一副本，
# 由符号链接暴露给 Neovide：
#   ln -sf ../nvim/neovide/config.toml                ~/.config/neovide/config.toml
#   ln -sf ../../../.config/nvim/neovide/config.toml  "$HOME/Library/Application Support/neovide/config.toml"
#
# 注意：本文件顶层键（如 startup-message-capture）必须写在所有
# [table] 之前，否则会被归入最近的表。
# ─────────────────────────────────────────────────────────────

# 关闭 Neovide 启动期的“临时外部消息 UI”。该 UI 会向 nvim 声明
# ext_messages / ext_cmdline，导致 noice 在 VeryLazy 加载时误判
# “GUI 接管了 cmdline / messages”，从而永久禁用自身对应 handler。
# 关掉后 noice 的 cmdline popup、消息视图在 Neovide 里恢复正常。
# 参考：https://neovide.dev/command-line-reference（--no-startup-message-capture）
#       https://neovide.dev/config-file（startup-message-capture）
startup-message-capture = false

[font]
normal = ["Maple Mono NF CN"]
bold = [{ family = "Maple Mono NF CN", style = "Bold" }]
italic = [{ family = "Maple Mono NF CN", style = "Italic" }]
bold_italic = [{ family = "Maple Mono NF CN", style = "Bold Italic" }]
size = 14.0
